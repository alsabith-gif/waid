<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Best Practices -->
  <title>Checkout | WAID Luxury Leather Footwear</title>
  <meta name="description" content="Securely complete your purchase of premium leather shoes at WAID store checkout.">
  
  <!-- Styling -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Floating Navigation Header (Dynamically Injected) -->
  <header></header>

  <!-- Checkout Layout Content -->
  <main class="container" style="padding-bottom: 6rem;">
    <div class="checkout-layout">
      
      <!-- Checkout Steps Forms (Left Column) -->
      <section id="checkout-container">
        <h1 style="font-family: var(--font-serif); font-size: 2.2rem; margin-bottom: 2.5rem;">Secure Checkout</h1>
        
        <form id="checkout-steps-form">
          
          <!-- Step 1: Customer Contact -->
          <div class="checkout-step-container">
            <div class="checkout-step-header">
              <span class="step-num">1</span>
              <h3>Contact Information</h3>
            </div>
            <div class="form-group">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" id="email" class="form-input" placeholder="email@domain.com" required>
            </div>
            <div class="form-group">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" id="phone" class="form-input" placeholder="(555) 555-5555" required>
            </div>
          </div>
          
          <!-- Step 2: Shipping Address -->
          <div class="checkout-step-container">
            <div class="checkout-step-header">
              <span class="step-num">2</span>
              <h3>Shipping Address</h3>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="first-name" class="form-label">First Name</label>
                <input type="text" id="first-name" class="form-input" required>
              </div>
              <div class="form-group">
                <label for="last-name" class="form-label">Last Name</label>
                <input type="text" id="last-name" class="form-input" required>
              </div>
            </div>
            <div class="form-group">
              <label for="address" class="form-label">Street Address</label>
              <input type="text" id="address" class="form-input" placeholder="Apt, Suite, Building, Street" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="city" class="form-label">City</label>
                <input type="text" id="city" class="form-input" required>
              </div>
              <div class="form-group">
                <label for="zip" class="form-label">Postal / ZIP Code</label>
                <input type="text" id="zip" class="form-input" required>
              </div>
            </div>
          </div>
          
          <!-- Step 3: Payment Details (Simulated Gateway) -->
          <div class="checkout-step-container">
            <div class="checkout-step-header">
              <span class="step-num">3</span>
              <h3>Payment Method</h3>
            </div>
            <div class="form-group">
              <label for="cc-name" class="form-label">Cardholder Name</label>
              <input type="text" id="cc-name" class="form-input" placeholder="As it appears on card" required>
            </div>
            <div class="form-group">
              <label for="cc-number" class="form-label">Credit Card Number</label>
              <input type="text" id="cc-number" class="form-input" placeholder="0000 0000 0000 0000" maxlength="19" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="cc-expiry" class="form-label">Expiration Date</label>
                <input type="text" id="cc-expiry" class="form-input" placeholder="MM / YY" maxlength="7" required>
              </div>
              <div class="form-group">
                <label for="cc-cvv" class="form-label">Security Code (CVV)</label>
                <input type="password" id="cc-cvv" class="form-input" placeholder="***" maxlength="4" required>
              </div>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2rem;">Place Order</button>
        </form>
      </section>
      
      <!-- Order Summary Panel (Right Column) -->
      <aside class="order-summary-panel">
        <h2 style="font-family: var(--font-serif); font-size: 1.4rem; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.8rem;">Your Order</h2>
        
        <!-- Cart list container -->
        <div id="checkout-summary-items" style="max-height: 350px; overflow-y: auto; margin-bottom: 2rem;">
          <!-- Rendered dynamically -->
        </div>
        
        <!-- Billing Breakdowns -->
        <div id="checkout-billing-details">
          <!-- Rendered dynamically -->
        </div>
        
        <div style="margin-top: 2rem; display: flex; gap: 0.8rem; align-items: center; background-color: rgba(92, 58, 33, 0.05); padding: 1rem; border: 1px dashed var(--color-border);">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="color: var(--color-primary); flex-shrink: 0;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <p style="font-size: 0.75rem; color: var(--color-text-muted); line-height: 1.4;">Your transaction is secure. We use simulated sandbox gateways with AES-256 bank-grade encryption algorithms to safeguard your credentials.</p>
        </div>
      </aside>
      
    </div>
  </main>

  <!-- Brand Footer (Dynamically Injected) -->
  <footer></footer>

  <!-- Scripts -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
